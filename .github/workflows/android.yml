name: Build RaceLab APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check PIT relay health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 1 --connect-timeout 5 --max-time 10 \
            https://racelab-pit-relay.irradiated-tree.workers.dev/health | grep -q '"ok":true'
      - name: Unit tests
        run: gradle --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RaceLab-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
