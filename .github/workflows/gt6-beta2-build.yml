name: GT6 Beta2.1 FIX APK

on:
  push:
    branches: [ "ci/gt6-v6-beta2-apk" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and apply Beta2.1 fix
        shell: bash
        run: |
          cat gt6-ci/part_00 gt6-ci/part_01 gt6-ci/part_02 gt6-ci/part_03 gt6-ci/part_04 gt6-ci/part_05 gt6-ci/part_06 gt6-ci/part_07 gt6-ci/part_08 gt6-ci/part_09 gt6-ci/part_10 gt6-ci/part_11 gt6-ci/part_12 > /tmp/gt6.b64
          base64 -d /tmp/gt6.b64 > /tmp/gt6.zip
          rm -rf /tmp/gt6src gt6-beta2
          mkdir -p /tmp/gt6src
          set +e
          unzip -o /tmp/gt6.zip -d /tmp/gt6src
          UNZIP_RC=$?
          set -e
          test -d /tmp/gt6src/gt6_beta2_ci
          mv /tmp/gt6src/gt6_beta2_ci ./gt6-beta2
          cp gt6-ci/TrackingOverlay.clean.kt gt6-beta2/app/src/main/java/com/tsss/gt6v6/app/TrackingOverlay.kt
          test "$(git hash-object gt6-beta2/app/src/main/java/com/tsss/gt6v6/app/TrackingOverlay.kt)" = "f59543d72694aa14e23d949750b91c9907d86cc3"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('gt6-beta2')
          def rep(rel, old, new):
              p = root / rel
              s = p.read_text()
              assert old in s, f'missing pattern in {rel}: {old[:80]!r}'
              p.write_text(s.replace(old, new, 1))

          rep('app/build.gradle.kts', 'applicationId = "com.tsss.gt6v6.nativeapp"', 'applicationId = "com.tsss.gt6v6.fix621"')
          rep('app/build.gradle.kts', 'versionCode = 6020001', 'versionCode = 6020101')
          rep('app/build.gradle.kts', 'versionName = "6.2.0-beta2-real-device-calibration"', 'versionName = "6.2.1-beta2-fix"')
          rep('app/src/main/AndroidManifest.xml', 'android:label="GT6 v6 Beta1"', 'android:label="GT6 v6.2.1 FIX"')
          rep('app/src/main/java/com/tsss/gt6v6/app/OnnxYoloDetectorPort.kt', 'YOLO26n 320x320 detector adapter', 'YOLO26n 640x640 detector adapter')
          onnx = root / 'app/src/main/java/com/tsss/gt6v6/app/OnnxYoloDetectorPort.kt'
          assert 'private const val S = 640' in onnx.read_text()

          rep('app/src/main/java/com/tsss/gt6v6/app/DetectorPipeline.kt',
              'import java.util.concurrent.atomic.AtomicReference',
              'import java.util.concurrent.atomic.AtomicReference\nimport android.util.Log')
          rep('app/src/main/java/com/tsss/gt6v6/app/DetectorPipeline.kt',
              '''        worker.execute {\n            try {\n                latest.set(port.detect(frame))\n            } finally {\n                engine.detectorFinished(command.requestId, System.nanoTime())\n            }\n        }''',
              '''        worker.execute {\n            try {\n                latest.set(port.detect(frame))\n            } catch (t: Throwable) {\n                Log.e("GT6-DETECTOR", "Detector request ${command.requestId} failed", t)\n                latest.set(emptyList())\n            } finally {\n                engine.detectorFinished(command.requestId, System.nanoTime())\n            }\n        }''')

          rep('app/src/main/java/com/tsss/gt6v6/app/MainActivity.kt',
              '// Copy only a 320x320 luminance thumbnail on detector wake.',
              '// Copy a 640x640 luminance frame only on detector wake.')
          rep('app/src/main/java/com/tsss/gt6v6/app/MainActivity.kt', 'val size = 320', 'val size = 640')

          rep('app/src/main/cpp/engine/src/sparse_lk_gmc.cpp',
              'o.quality=clampf(0.45f*inlierRatio+0.35f*photo+0.20f*coverage,0.0f,1.0f);',
              'o.quality=clampf(0.55f*inlierRatio+0.15f*photo+0.30f*coverage,0.0f,1.0f);')

          rep('app/src/main/cpp/engine/src/tracker_engine.cpp',
              '''void TrackerEngine::classify_motion(float dx,float dy,float quality){\n    float sp=sqrt_pos(dx*dx+dy*dy),c=cosine(last_dx_,last_dy_,dx,dy); float ratio=(last_speed_>1e-4f)?sp/last_speed_:1.0f;\n    MotionMode detected=MotionMode::Straight;''',
              '''void TrackerEngine::classify_motion(float dx,float dy,float quality){\n    float sp=sqrt_pos(dx*dx+dy*dy);\n    constexpr float kMotionDeadband = 0.0020f;\n    if(sp<kMotionDeadband){\n        motion_mode_=MotionMode::Straight; shock_enter_=shock_exit_=0;\n        last_speed_=sp; last_dx_=dx; last_dy_=dy; return;\n    }\n    float c=cosine(last_dx_,last_dy_,dx,dy); float ratio=(last_speed_>kMotionDeadband)?sp/last_speed_:1.0f;\n    MotionMode detected=MotionMode::Straight;''')
          rep('app/src/main/cpp/engine/src/tracker_engine.cpp',
              'if(c<cfg_.reversal_cos&&quality>0.62f)detected=MotionMode::Shock;',
              'if(c<cfg_.reversal_cos&&quality>0.62f&&last_speed_>kMotionDeadband)detected=MotionMode::Shock;')

          rep('app/src/main/cpp/gt6_jni.cpp',
              '''    const bool ok=e->tracker.seed(f,b) && e->flow.seed(f,b);\n    return ok?JNI_TRUE:JNI_FALSE;''',
              '''    const bool flowOk=e->flow.seed(f,b);\n    const bool trackerOk=flowOk && e->tracker.seed(f,b);\n    const bool ok=flowOk && trackerOk;\n    if(!ok){ e->tracker.reset(); e->flow.reset(); e->detector.reset(); }\n    return ok?JNI_TRUE:JNI_FALSE;''')
          print('Beta2.1 source fix applied')
          PY
          grep -q 'applicationId = "com.tsss.gt6v6.fix621"' gt6-beta2/app/build.gradle.kts
          grep -q 'versionName = "6.2.1-beta2-fix"' gt6-beta2/app/build.gradle.kts
          grep -q 'android:label="GT6 v6.2.1 FIX"' gt6-beta2/app/src/main/AndroidManifest.xml
          grep -q 'val size = 640' gt6-beta2/app/src/main/java/com/tsss/gt6v6/app/MainActivity.kt
          echo "unzip exit code: $UNZIP_RC (known archive CRC entry replaced)"

      - name: Download and verify YOLO26n ONNX
        shell: bash
        run: |
          mkdir -p gt6-beta2/app/src/main/assets
          curl -L --fail --retry 3 \
            https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.onnx \
            -o gt6-beta2/app/src/main/assets/yolo26n.onnx
          test -s gt6-beta2/app/src/main/assets/yolo26n.onnx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gt6-beta2/app/src/main/assets/yolo26n.onnx')
          print('YOLO bytes', p.stat().st_size)
          assert p.stat().st_size > 9_000_000
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: gt6-beta2
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=gt6-beta2/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" GT6-Target-Lock-v6.2.1-FIX-SIDEBYSIDE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gt6-v6.2.1-fix-sidebyside-apk
          path: GT6-Target-Lock-v6.2.1-FIX-SIDEBYSIDE.apk
          if-no-files-found: error
