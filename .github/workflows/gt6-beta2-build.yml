name: GT6 Beta2.1 FIX APK

on:
  push:
    branches: [ "ci/gt6-v6-beta2-apk" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source and apply Beta2.1 fix
        shell: bash
        run: |
          cat gt6-ci/part_00 gt6-ci/part_01 gt6-ci/part_02 gt6-ci/part_03 gt6-ci/part_04 gt6-ci/part_05 gt6-ci/part_06 gt6-ci/part_07 gt6-ci/part_08 gt6-ci/part_09 gt6-ci/part_10 gt6-ci/part_11 gt6-ci/part_12 > /tmp/gt6.b64
          base64 -d /tmp/gt6.b64 > /tmp/gt6.zip
          rm -rf /tmp/gt6src gt6-beta2
          mkdir -p /tmp/gt6src
          set +e
          unzip -o /tmp/gt6.zip -d /tmp/gt6src
          UNZIP_RC=$?
          set -e
          test -d /tmp/gt6src/gt6_beta2_ci
          mv /tmp/gt6src/gt6_beta2_ci ./gt6-beta2
          cp gt6-ci/TrackingOverlay.clean.kt gt6-beta2/app/src/main/java/com/tsss/gt6v6/app/TrackingOverlay.kt
          test "$(git hash-object gt6-beta2/app/src/main/java/com/tsss/gt6v6/app/TrackingOverlay.kt)" = "f59543d72694aa14e23d949750b91c9907d86cc3"
          (cd gt6-beta2 && patch -p1 < ../gt6-ci/beta2.1-fix.patch)
          grep -q 'versionName = "6.2.1-beta2-fix"' gt6-beta2/app/build.gradle.kts
          grep -q 'android:label="GT6 v6.2.1 FIX"' gt6-beta2/app/src/main/AndroidManifest.xml
          grep -q 'private const val S = 640' gt6-beta2/app/src/main/java/com/tsss/gt6v6/app/OnnxYoloDetectorPort.kt
          echo "unzip exit code: $UNZIP_RC (known archive CRC entry replaced before patch)"

      - name: Download and verify YOLO26n ONNX
        shell: bash
        run: |
          mkdir -p gt6-beta2/app/src/main/assets
          curl -L --fail --retry 3 \
            https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.onnx \
            -o gt6-beta2/app/src/main/assets/yolo26n.onnx
          test -s gt6-beta2/app/src/main/assets/yolo26n.onnx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gt6-beta2/app/src/main/assets/yolo26n.onnx')
          print('YOLO bytes', p.stat().st_size)
          assert p.stat().st_size > 9_000_000
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: gt6-beta2
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=gt6-beta2/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" GT6-Target-Lock-v6.2.1-FIX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gt6-v6.2.1-fix-apk
          path: GT6-Target-Lock-v6.2.1-FIX.apk
          if-no-files-found: error
