name: GT6 DroidDrone Tracker APK

on:
  push:
    branches:
      - gt6-droiddrone-apk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Clone DroidDrone v2.3.0
        run: |
          git clone --branch v2.3.0 --depth 1 --recurse-submodules https://github.com/DroidDrone/DroidDrone.git DroidDrone
          cd DroidDrone
          git submodule update --init --recursive

      - name: Apply GT6 tracker patch
        run: |
          python3 .gt6build/apply_tracker_patch.py DroidDrone
          grep -n "versionName\|versionCode" DroidDrone/Flight/build.gradle

      - name: Build Flight debug APK
        working-directory: DroidDrone
        run: |
          chmod +x gradlew
          ./gradlew :Flight:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find DroidDrone/Flight/build/outputs/apk -type f -name '*debug*.apk' | head -1)
          test -n "$APK"
          cp "$APK" out/GT6-DroidDrone-Flight-TRACKER-v2-debug.apk
          sha256sum out/GT6-DroidDrone-Flight-TRACKER-v2-debug.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT6-DroidDrone-Flight-TRACKER-v2-debug
          path: out/*
          if-no-files-found: error
