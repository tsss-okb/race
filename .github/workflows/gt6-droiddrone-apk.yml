name: GT6 DroidDrone Tracker APK v3

on:
  push:
    branches:
      - gt6-droiddrone-apk-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 34
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Clone DroidDrone v2.3.0
        run: |
          git clone --branch v2.3.0 --depth 1 --recurse-submodules https://github.com/DroidDrone/DroidDrone.git DroidDrone
          cd DroidDrone
          git submodule update --init --recursive

      - name: Apply tracker v2 base patch
        run: |
          python3 .gt6build/apply_tracker_patch.py DroidDrone

      - name: Apply v3 safe-camera fix
        run: |
          python3 .gt6build/apply_v3_fix.py DroidDrone
          grep -n "applicationId\|versionName\|versionCode" DroidDrone/Flight/build.gradle

      - name: Build Flight debug APK
        working-directory: DroidDrone
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          chmod +x gradlew
          ./gradlew :Flight:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find DroidDrone/Flight/build/outputs/apk -type f -name '*debug*.apk' | head -1)
          test -n "$APK"
          cp "$APK" out/GT6-DroidDrone-Flight-TRACKER-v3-SAFE-debug.apk
          sha256sum out/GT6-DroidDrone-Flight-TRACKER-v3-SAFE-debug.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT6-DroidDrone-Flight-TRACKER-v3-SAFE-debug
          path: out/*
          if-no-files-found: error
