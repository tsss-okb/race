name: GT6 DroidDrone v4 Robust APK

on:
  push:
    branches:
      - gt6-droiddrone-apk-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK and NDK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.3.11579264"

      - name: Clone clean DroidDrone v2.3.0
        run: |
          git clone --branch v2.3.0 --depth 1 --recurse-submodules https://github.com/DroidDrone/DroidDrone.git DroidDrone
          cd DroidDrone
          git submodule update --init --recursive

      - name: Apply GT6 v4 patch
        run: |
          python3 .gt6build/v4/apply_v4_patch.py DroidDrone
          python3 .gt6build/v4/fix_compile.py DroidDrone
          grep -n "applicationId\|versionName\|versionCode\|useLegacyPackaging" DroidDrone/Flight/build.gradle
          ! grep -R "xmaihh\|SerialHelper" DroidDrone/Flight/src/main/java/de/droiddrone/flight/Serial.java

      - name: Tracker JVM self-test
        run: |
          rm -rf /tmp/gt6track && mkdir -p /tmp/gt6track/src/de/droiddrone/flight /tmp/gt6track/out
          cp DroidDrone/Flight/src/main/java/de/droiddrone/flight/TargetTracker.java /tmp/gt6track/src/de/droiddrone/flight/
          cp .gt6build/v4/TrackerSelfTest.java /tmp/gt6track/src/de/droiddrone/flight/
          javac -d /tmp/gt6track/out /tmp/gt6track/src/de/droiddrone/flight/*.java
          java -cp /tmp/gt6track/out de.droiddrone.flight.TrackerSelfTest

      - name: Build Flight debug APK
        working-directory: DroidDrone
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          chmod +x gradlew
          ./gradlew :Flight:assembleDebug --stacktrace --no-daemon

      - name: Verify APK and 16KB ELF alignment
        run: |
          set -euo pipefail
          mkdir -p out verify
          APK=$(find DroidDrone/Flight/build/outputs/apk -type f -name '*debug*.apk' | head -1)
          test -n "$APK"
          cp "$APK" out/GT6-DroidDrone-Flight-v4-ROBUST-debug.apk
          APK=out/GT6-DroidDrone-Flight-v4-ROBUST-debug.apk
          unzip -t "$APK" >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$APK" | tee out/APKSIGNER.txt
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee out/BADGING.txt
          grep -q "package: name='de.droiddrone.flight.gt6v4'" out/BADGING.txt
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d verify
          test ! -e verify/lib/arm64-v8a/libserialport.so
          find verify/lib/arm64-v8a -type f -name '*.so' -print | sort | tee out/NATIVE_LIBS.txt
          python3 - <<'PY' | tee out/ELF_ALIGNMENT.txt
          import pathlib, subprocess, sys
          libs=sorted(pathlib.Path('verify/lib/arm64-v8a').glob('*.so'))
          if not libs:
              raise SystemExit('No arm64 libraries found')
          bad=[]
          for lib in libs:
              out=subprocess.check_output(['readelf','-lW',str(lib)],text=True)
              aligns=[]
              for line in out.splitlines():
                  p=line.split()
                  if p and p[0]=='LOAD':
                      aligns.append(int(p[-1],16))
              minimum=min(aligns) if aligns else 0
              print(f'{lib.name}: LOAD alignments={[hex(x) for x in aligns]} min={hex(minimum)}')
              if minimum < 0x4000:
                  bad.append(lib.name)
          if bad:
              print('BAD_16KB:', ', '.join(bad))
              sys.exit(1)
          print('ELF_16KB_OK')
          PY
          unzip -lv "$APK" | grep 'lib/arm64-v8a/.*\.so' | tee out/ZIP_NATIVE_ENTRIES.txt
          sha256sum "$APK" | tee out/SHA256.txt
          echo "GT6_V4_VERIFY_OK" | tee out/VERIFY_OK.txt

      - name: Android 16 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/out/GT6-DroidDrone-Flight-v4-ROBUST-debug.apk"
            adb install -r "$APK"
            adb shell pm grant de.droiddrone.flight.gt6v4 android.permission.CAMERA
            adb shell pm grant de.droiddrone.flight.gt6v4 android.permission.RECORD_AUDIO
            adb logcat -c
            adb shell am force-stop de.droiddrone.flight.gt6v4
            adb shell am start -W -n de.droiddrone.flight.gt6v4/de.droiddrone.flight.MainActivity | tee "$GITHUB_WORKSPACE/out/SMOKE_ACTIVITY.txt"
            sleep 3
            test -n "$(adb shell pidof de.droiddrone.flight.gt6v4 | tr -d '\r')"
            adb shell am start-foreground-service -n de.droiddrone.flight.gt6v4/de.droiddrone.flight.DDService | tee "$GITHUB_WORKSPACE/out/SMOKE_SERVICE.txt"
            sleep 5
            adb shell dumpsys activity services de.droiddrone.flight.gt6v4 > "$GITHUB_WORKSPACE/out/SMOKE_SERVICES.txt" || true
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/out/SMOKE_LOGCAT.txt"
            if grep -E "FATAL EXCEPTION|Process: de\.droiddrone\.flight\.gt6v4" "$GITHUB_WORKSPACE/out/SMOKE_LOGCAT.txt"; then
              echo "GT6_V4_SMOKE_FATAL" | tee "$GITHUB_WORKSPACE/out/SMOKE_RESULT.txt"
              exit 1
            fi
            test -n "$(adb shell pidof de.droiddrone.flight.gt6v4 | tr -d '\r')"
            echo "GT6_V4_ANDROID16_SMOKE_OK" | tee "$GITHUB_WORKSPACE/out/SMOKE_RESULT.txt"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: GT6-DroidDrone-Flight-v4-ROBUST-debug
          path: out/*
          if-no-files-found: error
