name: GT6 DroidDrone baseline APKs

on:
  push:
    branches: [ "gt6-droiddrone-legacy511" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Checkout DroidDrone upstream
        run: |
          set -euxo pipefail
          git clone --recursive --depth 1 https://github.com/IvanSchulz/DroidDrone.git /tmp/DroidDrone
          cd /tmp/DroidDrone
          git submodule update --init --recursive
          printf 'MAPS_API_KEY=\n' > local.defaults.properties
          chmod +x gradlew

      - name: Build Flight and Control debug APKs
        working-directory: /tmp/DroidDrone
        run: ./gradlew --no-daemon --stacktrace :Flight:assembleDebug :Control:assembleDebug

      - name: Verify APKs
        run: |
          set -euxo pipefail
          FLIGHT=/tmp/DroidDrone/Flight/build/outputs/apk/debug/Flight-debug.apk
          CONTROL=/tmp/DroidDrone/Control/build/outputs/apk/debug/Control-debug.apk
          for APK in "$FLIGHT" "$CONTROL"; do
            test -f "$APK"
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$APK"
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
            unzip -l "$APK" | grep -q 'classes.dex'
          done

      - name: Upload Flight APK
        uses: actions/upload-artifact@v4
        with:
          name: GT6-DroidDrone-Flight-BASELINE-debug
          path: /tmp/DroidDrone/Flight/build/outputs/apk/debug/Flight-debug.apk
          if-no-files-found: error

      - name: Upload Control APK
        uses: actions/upload-artifact@v4
        with:
          name: GT6-DroidDrone-Control-BASELINE-debug
          path: /tmp/DroidDrone/Control/build/outputs/apk/debug/Control-debug.apk
          if-no-files-found: error
