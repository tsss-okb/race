name: GT6 Optical + Tracker v2.3 APK

on:
  push:
    branches: [ "gt6-optical-build-20260909" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack GT6 v2.3
        run: |
          rm -rf /tmp/gt6-v23
          mkdir -p /tmp/gt6-v23
          unzip -q gt6-optical/GT6OpticalLensTest-v2.3-TRACKER-SOURCE.zip -d /tmp/gt6-v23
          test -f /tmp/gt6-v23/GT6OpticalLensTest/app/src/main/jniLibs/arm64-v8a/libgt6lock.so
      - name: Build debug APK
        working-directory: /tmp/gt6-v23/GT6OpticalLensTest
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT6OpticalLensTest-v2.3-TRACKER-debug
          path: /tmp/gt6-v23/GT6OpticalLensTest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
