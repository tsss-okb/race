name: Legacy Tracker Lab Test

on:
  push:
    branches: [targetlock-android-apk]
    paths:
      - 'legacy_tracker_lab/**'
      - '.github/workflows/legacy-tracker-lab-test.yml'
  workflow_dispatch:

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless
      - name: Run synthetic hold test
        working-directory: legacy_tracker_lab
        run: python synthetic_test.py
