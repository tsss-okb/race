name: Deploy Pit Lane Viewer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "pit-viewer/**"
      - ".github/workflows/pit-viewer-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload viewer
        uses: actions/upload-pages-artifact@v3
        with:
          path: pit-viewer

      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check claimed relay API
        run: |
          curl --fail --silent --show-error --max-time 10 \
            https://racelab-pit-relay.glacier-boursin.workers.dev/health
