name: TargetLock APK

on:
  push:
    branches: [targetlock-android-apk]
    paths:
      - 'targetlock/**'
      - '.github/workflows/targetlock-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: targetlock
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TargetLock-debug-apk
          path: targetlock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
