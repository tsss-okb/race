name: TargetLock APK

on:
  push:
    branches: [targetlock-android-apk]
    paths:
      - 'targetlock/**'
      - '.github/workflows/targetlock-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle YOLO26n model
        run: |
          mkdir -p targetlock/app/src/main/assets
          curl -L --fail --retry 4 --retry-delay 2 \
            https://github.com/ultralytics/yolo-flutter-app/releases/download/v0.6.6/yolo26n_w8a32.tflite \
            -o targetlock/app/src/main/assets/yolo26n_w8a32.tflite
      - name: Build APK
        working-directory: targetlock
        run: gradle --no-daemon clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TargetLock-v1.1-Dashboard-Hold-apk
          path: targetlock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
