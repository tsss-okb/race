<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>RaceLab Pit Lane</title>
<style>
:root{color-scheme:dark;--bg:#050607;--panel:#111315;--line:#292d31;--muted:#989da2;--yellow:#f2c300;--green:#58e13e;--red:#ff3b30;--white:#f2f2f2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.grid{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px}
.header{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.title{font-size:clamp(18px,2.5vw,32px);font-weight:900;letter-spacing:.08em}
.status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:clamp(12px,1.5vw,20px)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 14px rgba(255,59,48,.6)}
.dot.ok{background:var(--green);box-shadow:0 0 16px rgba(88,225,62,.75)}
.main{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:10px;min-height:0}
.card{background:linear-gradient(#171a1d,#0b0d0f);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.label{color:var(--muted);font-size:clamp(11px,1.25vw,17px);font-weight:800;letter-spacing:.08em}
.pit{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pit.active{border-color:var(--yellow);box-shadow:inset 0 0 0 1px rgba(242,195,0,.35),0 0 28px rgba(242,195,0,.13)}
.pitstate{font-size:clamp(20px,3vw,40px);font-weight:900;color:var(--green);letter-spacing:.08em}
.pit.active .pitstate{color:var(--yellow)}
.bigtime{font-variant-numeric:tabular-nums;font-size:clamp(58px,9.5vw,148px);line-height:.95;font-weight:900;white-space:nowrap;margin:10px 0}
.hundredths{color:var(--yellow)}
.sub{color:var(--muted);font-size:clamp(12px,1.6vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stack{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.metric{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.value{font-variant-numeric:tabular-nums;font-size:clamp(30px,4.6vw,70px);font-weight:900;white-space:nowrap}
.value.green{color:var(--green)} .value.yellow{color:var(--yellow)}
.footer{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.foot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;min-width:0}
.foot .v{font-variant-numeric:tabular-nums;font-size:clamp(14px,2vw,28px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.error{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);padding:24px;text-align:center;z-index:10}
.error.show{display:grid}.error h1{color:var(--yellow)}
@media(max-width:700px){
  .main{grid-template-columns:1fr 1fr}
  .pit{grid-column:1/-1}
  .footer{grid-template-columns:repeat(3,1fr)}
  .footer .foot:nth-child(n+4){display:none}
  .bigtime{font-size:clamp(46px,14vw,92px)}
}
</style>
</head>
<body>
<div id="error" class="error">
  <div><h1>RaceLab Pit Lane</h1><p>Некорректная ссылка Viewer. Скопируй новую ссылку из RaceLab.</p></div>
</div>

<div class="grid">
  <div class="header">
    <div class="title">RACELAB · PIT LANE</div>
    <div class="status"><span id="dot" class="dot"></span><span id="conn">ПОДКЛЮЧЕНИЕ…</span></div>
  </div>

  <div class="main">
    <div id="pitCard" class="card pit">
      <div id="pitState" class="pitstate">PIT READY</div>
      <div id="pitTime" class="bigtime">00:00.<span class="hundredths">00</span></div>
      <div id="trigger" class="sub">Ожидание телеметрии</div>
    </div>

    <div class="stack">
      <div class="card metric"><div class="label">LAST</div><div id="last" class="value">—</div></div>
      <div class="card metric"><div class="label">BEST</div><div id="best" class="value green">—</div></div>
    </div>

    <div class="stack">
      <div class="card metric"><div class="label">PIT #</div><div id="count" class="value yellow">0</div></div>
      <div class="card metric"><div class="label">SPEED</div><div><span id="speed" class="value">0</span> <span class="sub">км/ч</span></div></div>
    </div>
  </div>

  <div class="footer">
    <div class="foot"><div class="label">CURRENT LAP</div><div id="lap" class="v">00:00.00</div></div>
    <div class="foot"><div class="label">BEST LAP</div><div id="lapBest" class="v">—</div></div>
    <div class="foot"><div class="label">DELTA</div><div id="delta" class="v">—</div></div>
    <div class="foot"><div class="label">TRACK</div><div id="track" class="v">RaceLab</div></div>
    <div class="foot"><div class="label">GPS</div><div id="gps" class="v">0.0 Hz</div></div>
    <div class="foot"><div class="label">SIGNAL</div><div id="latency" class="v">—</div></div>
  </div>
</div>

<script>
const params=new URLSearchParams(location.hash.slice(1));
const RELAY=(params.get('relay')||'').replace(/\/$/,'');
const ROOM=params.get('room')||'';
const KEY=params.get('key')||'';
if(!/^https:\/\//.test(RELAY)||!ROOM||!KEY){document.getElementById('error').classList.add('show');throw new Error('bad viewer parameters')}

const fmt100=ms=>{
  if(ms==null)return '—';
  ms=Math.max(0,Math.round(Number(ms)||0));
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),c=Math.floor((ms%1000)/10);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0');
};
const fmtPitHtml=ms=>{
  ms=Math.max(0,Math.round(Number(ms)||0));
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),c=Math.floor((ms%1000)/10);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.<span class="hundredths">'+String(c).padStart(2,'0')+'</span>';
};
const delta=ms=>ms==null?'—':(ms<0?'−':'+')+(Math.abs(ms)/1000).toFixed(2);

let pitActive=false;
let pitBaseMs=0;
let pitBasePerf=performance.now();
let lastRelayReceivedAt=0;
let lastPollOkPerf=0;
let pollBusy=false;
let errorCount=0;
let lastRenderedCentisecond=-1;

function currentPitMs(){
  return pitActive ? pitBaseMs+(performance.now()-pitBasePerf) : pitBaseMs;
}

function animate(){
  const ms=currentPitMs();
  const cs=Math.floor(ms/10);
  if(cs!==lastRenderedCentisecond){
    lastRenderedCentisecond=cs;
    document.getElementById('pitTime').innerHTML=fmtPitHtml(ms);
  }

  const networkAge=lastRelayReceivedAt?Math.max(0,Date.now()-lastRelayReceivedAt):999999;
  const browserAge=lastPollOkPerf?Math.max(0,performance.now()-lastPollOkPerf):999999;
  const live=networkAge<2500&&browserAge<2500;
  document.getElementById('dot').className=live?'dot ok':'dot';
  document.getElementById('conn').textContent=live?'LIVE':(errorCount?'НЕТ СВЯЗИ':'STALE');
  document.getElementById('latency').textContent=lastRelayReceivedAt?Math.round(networkAge)+' ms':'—';

  requestAnimationFrame(animate);
}

async function poll(){
  if(pollBusy)return;
  pollBusy=true;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),1200);
  try{
    const url=RELAY+'/api/room/'+encodeURIComponent(ROOM)+'?key='+encodeURIComponent(KEY)+'&t='+Date.now();
    const r=await fetch(url,{cache:'no-store',signal:controller.signal,headers:{'Accept':'application/json'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();

    errorCount=0;
    lastPollOkPerf=performance.now();
    lastRelayReceivedAt=Number(d.relayReceivedAtMs||Date.now());

    pitActive=!!d.pitActive;
    pitBaseMs=Number(d.pitCurrentMs||0);
    pitBasePerf=performance.now();

    document.getElementById('pitCard').classList.toggle('active',pitActive);
    document.getElementById('pitState').textContent=pitActive?'PIT ACTIVE':'PIT READY';
    document.getElementById('trigger').textContent=d.pitTrigger||'—';
    document.getElementById('last').textContent=fmt100(d.pitLastMs);
    document.getElementById('best').textContent=fmt100(d.pitBestMs);
    document.getElementById('count').textContent=d.pitCount||0;
    document.getElementById('speed').textContent=Math.round(d.speedKmh||0);
    document.getElementById('lap').textContent=fmt100(d.lapCurrentMs);
    document.getElementById('lapBest').textContent=fmt100(d.lapBestMs);

    const de=document.getElementById('delta');
    de.textContent=delta(d.deltaMs);
    de.style.color=d.deltaMs==null?'#f2f2f2':(d.deltaMs<=0?'#58e13e':'#ff3b30');

    document.getElementById('track').textContent=d.track||'RaceLab';
    document.getElementById('gps').textContent=(Number(d.gpsHz)||0).toFixed(1)+' Hz · S'+(d.satellites||0);
  }catch(e){
    errorCount++;
  }finally{
    clearTimeout(timeout);
    pollBusy=false;
    setTimeout(poll,100);
  }
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!pollBusy)poll();
});

requestAnimationFrame(animate);
poll();
</script>
</body>
</html>
