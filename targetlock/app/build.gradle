plugins { id 'com.android.application' }

android {
    namespace 'com.tsss.targetlock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tsss.targetlockstable'
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName '1.9.0'
    }

    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
}
