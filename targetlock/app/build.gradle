plugins { id 'com.android.application' }

android {
    namespace 'com.tsss.targetlock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tsss.targetlock120core'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.1.0'
    }

    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
}
