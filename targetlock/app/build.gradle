plugins { id 'com.android.application' }

android {
    namespace 'com.tsss.targetlock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tsss.targetlockhybrid'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '1.5.0'
    }

    androidResources {
        noCompress 'tflite'
    }

    packaging {
        resources {
            // JavaCPP/OpenCV/OpenBLAS ship duplicate GraalVM metadata.
            // Android runtime does not use native-image configuration files.
            excludes += ['META-INF/native-image/**']
        }
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'

    // OpenCV 4.13 + opencv_contrib tracking via JavaCPP.
    // Keep only Android arm64 natives for the Realme/modern Android target.
    implementation 'org.bytedeco:opencv:4.13.0-1.5.13'
    runtimeOnly 'org.bytedeco:opencv:4.13.0-1.5.13:android-arm64'
    runtimeOnly 'org.bytedeco:openblas:0.3.31-1.5.13:android-arm64'
}
